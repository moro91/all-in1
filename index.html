<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مزرعه سه‌بعدی من 🌾</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, "Segoe UI", sans-serif; }
    body { overflow: hidden; background: #87CEEB; color: #2d3436; }
    .hidden { display: none !important; }

    /* محیط 3D */
    #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* رابط کاربری */
    .ui-layer { position: absolute; z-index: 10; pointer-events: none; }
    .ui-panel { pointer-events: auto; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); padding: 15px; border: 1px solid rgba(255,255,255,0.5); }

    /* نوار بالا */
    #topBar { top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
    .farm-name { font-weight: bold; font-size: 20px; color: #27ae60; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }
    .coins { font-weight: bold; font-size: 20px; color: #e67e22; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

    /* منوی کناری (فروشگاه و انبار) */
    #sidePanel { top: 80px; right: 15px; bottom: 15px; width: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    #sidePanel::-webkit-scrollbar { width: 6px; }
    #sidePanel::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 3px; }
    
    .panel h2 { font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #dfe6e9; padding-bottom: 5px; color: #2c3e50; }
    .btn { padding: 8px 12px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; color: #fff; font-weight: bold; width: 100%; margin-bottom: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .btn-green { background: #27ae60; }
    .btn-blue { background: #3498db; }
    .btn-purple { background: #9b59b6; }
    .btn-seed { background: #16a085; }
    .btn-buy { background: #e67e22; }
    .btn-harvest { background: #f39c12; }

    .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; }
    .inv-item { background: #ecf0f1; padding: 8px; border-radius: 6px; text-align: center; }

    /* صفحه شروع */
    #startScreen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
    .modal { background: #fff; padding: 30px; border-radius: 16px; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .modal h1 { color: #27ae60; margin-bottom: 15px; }
    .modal input { width: 100%; padding: 10px; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 16px; }
    .modal button { padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }

    /* Toast */
    .toast { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(44, 62, 80, 0.9); color: #fff; padding: 12px 24px; border-radius: 30px; z-index: 1000; font-size: 15px; animation: fadein 0.3s; pointer-events: none; }
    @keyframes fadein { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
  <!-- کتابخانه Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- محیط 3D -->
  <div id="canvas-container"></div>

  <div id="toast" class="toast hidden"></div>

  <!-- رابط کاربری -->
  <div id="gameUI" class="hidden">
    <div id="topBar" class="ui-panel">
      <div class="farm-name">🏡 <span id="farmNameDisplay"></span></div>
      <div class="coins">💰 <span id="coinsDisplay">0</span> سکه</div>
    </div>

    <div id="sidePanel" class="ui-layer">
      <div class="ui-panel panel">
        <h2>📦 انبار</h2>
        <div class="inv-grid">
          <div class="inv-item">🍎 سیب: <b id="invApples">0</b></div>
          <div class="inv-item">🥛 شیر: <b id="invMilk">0</b></div>
          <div class="inv-item">🧀 پنیر: <b id="invCheese">0</b></div>
          <div class="inv-item">🥚 تخم‌مرغ: <b id="invEggs">0</b></div>
        </div>
        <div style="margin-top:10px; font-size:13px; text-align:center;" id="merchantStatus">بازرگان در حال بررسی...</div>
        <button id="sellAllBtn" class="btn btn-green" style="margin-top:8px;">فروش همه محصولات</button>
      </div>

      <div class="ui-panel panel">
        <h2>🌱 زمین‌ها و بذرها</h2>
        <div style="font-size:13px; margin-bottom:8px;">بذر موجود: 🥬 <b id="seedVeg">0</b> | 🌾 <b id="seedWheat">0</b> | 🍎 <b id="seedApple">0</b></div>
        <button class="btn btn-seed" data-seed="vegetable">خرید بذر سبزی (5 سکه)</button>
        <button class="btn btn-seed" data-seed="wheat">خرید بذر گندم (2 سکه)</button>
        <button class="btn btn-seed" data-seed="apple">خرید بذر سیب (5 سکه)</button>
        <div id="landsContainer" style="margin-top:10px; display:flex; flex-direction:column; gap:5px;"></div>
        <button id="buyLandBtn" class="btn btn-blue" style="margin-top:10px;">خرید زمین جدید</button>
      </div>

      <div class="ui-panel panel">
        <h2>🐾 دامداری</h2>
        <div style="font-size:13px; margin-bottom:8px;">
          🐄 گاو: <b id="countCow">0</b> | 🐑 گوسفند: <b id="countSheep">0</b> | 🐔 مرغ: <b id="countChicken">0</b>
        </div>
        <button class="btn btn-buy" data-buy="sheep">خرید گوسفند (80 سکه)</button>
        <button class="btn btn-buy" data-buy="chicken">خرید مرغ (30 سکه)</button>
        <button class="btn btn-buy" data-buy="cow">خرید گاو (90 سکه)</button>
        <div id="animalsContainer" style="margin-top:10px; display:flex; flex-direction:column; gap:5px;"></div>
      </div>

      <div class="ui-panel panel">
        <h2>🎁 کد هدیه</h2>
        <input type="text" id="giftInput" placeholder="کد هدیه..." style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin-bottom:8px;" />
        <button id="giftBtn" class="btn btn-purple">دریافت جایزه</button>
      </div>
    </div>
  </div>

  <!-- صفحه شروع -->
  <div id="startScreen">
    <div class="modal">
      <h1>🌾 مزرعه سه‌بعدی</h1>
      <p style="margin-bottom:15px; color:#555;">نامی برای مزرعه خود انتخاب کنید:</p>
      <input type="text" id="farmNameInput" placeholder="مثال: مزرعه سبز" maxlength="15" />
      <button id="startBtn">ورود به بازی</button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. منطق بازی (State Management)
       ========================================================= */
    const SAVE_KEY = "farmGame3D_v1";
    const CONFIG = {
      START_COINS: 50, DAILY_BONUS: 10,
      SHEEP_PRICE: 80, CHICKEN_PRICE: 30, COW_PRICE: 90, LAND_BASE_PRICE: 100,
      SEED_PRICES: { vegetable: 5, wheat: 2, apple: 5 },
      CROP_VALUES: { vegetable: 2, wheat: 1, apple: 2 },
      SELL_PRICES: { apples: 1, milk: 3, cheese: 1, eggs: 3 },
      KILL_VALUES: { cow: 85, sheep: 75, chicken: 25 },
      COW_INTERVAL: 20 * 60 * 1000, SHEEP_INTERVAL: 20 * 60 * 1000, CHICKEN_INTERVAL: 10 * 60 * 1000,
      MERCHANT_INTERVAL: 30 * 60 * 1000,
      CROP_GROW_TIME: 2 * 60 * 60 * 1000, CROP_LIFETIME: 24 * 60 * 60 * 1000
    };
    const GIFT_CODES = { "FACTINEW10": 10, "FARM2026": 25, "WELCOME50": 50, "SHEEPGIFT": 80, "GOLDEN100": 100 };

    let state = null;
    let tickInterval = null;

    function now() { return Date.now(); }
    function formatTime(ms) {
      if (ms <= 0) return "آماده";
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 3600)}س ${Math.floor((s % 3600) / 60)}د`;
    }
    function localDateStr() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.remove("hidden");
      clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.add("hidden"), 2500);
    }
    function save() { if (state) localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
    function load() {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    }

    function createInitialState(farmName) {
      const t = now();
      return {
        version: 1, farmName, coins: CONFIG.START_COINS, lastLoginDate: "", usedGiftCodes: [],
        lands: [{ id: 1, crop: null, plantedAt: null, lastHarvestAt: null }], landsPurchased: 0,
        animals: { cow: 1, sheep: 0, chicken: 0 }, lastProduction: { cow: t, sheep: t, chicken: t },
        appleTree: { exists: true, lastHarvest: t }, lastMerchantVisit: t,
        inventory: { apples: 0, milk: 0, cheese: 0, eggs: 0 }, seeds: { vegetable: 0, wheat: 0, apple: 0 }
      };
    }

    function checkDailyBonus() {
      const today = localDateStr();
      if (state.lastLoginDate !== today) {
        state.coins += CONFIG.DAILY_BONUS; state.lastLoginDate = today; save();
        setTimeout(() => showToast(`🎁 پاداش ورود روزانه: +${CONFIG.DAILY_BONUS} سکه`), 1000);
      }
    }

    function processTimers() {
      const t = now(); let changed = false;
      // تولیدات دامی
      ["cow", "sheep", "chicken"].forEach(key => {
        const count = state.animals[key];
        if (count > 0) {
          const interval = key === "chicken" ? CONFIG.CHICKEN_INTERVAL : (key === "cow" ? CONFIG.COW_INTERVAL : CONFIG.SHEEP_INTERVAL);
          const cycles = Math.floor((t - state.lastProduction[key]) / interval);
          if (cycles > 0) {
            const produced = cycles * count;
            if (key === "cow") state.inventory.milk += produced;
            if (key === "sheep") { state.inventory.milk += produced; state.inventory.cheese += produced; }
            if (key === "chicken") state.inventory.eggs += produced;
            state.lastProduction[key] += cycles * interval; changed = true;
          }
        }
      });
      // درخت سیب اولیه
      if (state.appleTree.exists) {
        const cycles = Math.floor((t - state.appleTree.lastHarvest) / CONFIG.COW_INTERVAL);
        if (cycles > 0) {
          for (let i = 0; i < cycles; i++) state.inventory.apples += Math.random() < 0.5 ? 3 : 4;
          state.appleTree.lastHarvest += cycles * CONFIG.COW_INTERVAL; changed = true;
        }
      }
      // مرگ گیاهان
      state.lands.forEach(land => {
        if (land.crop && (t - land.plantedAt) >= CONFIG.CROP_LIFETIME) {
          land.crop = null; land.plantedAt = null; land.lastHarvestAt = null; changed = true;
        }
      });
      if (changed) { save(); update3DScene(); } // آپدیت 3D اگر تغییری رخ داد
    }

    function getNextLandPrice() { return CONFIG.LAND_BASE_PRICE * Math.pow(2, state.landsPurchased); }
    function isMerchantPresent() { return (now() - state.lastMerchantVisit) >= CONFIG.MERCHANT_INTERVAL; }

    /* =========================================================
       2. تعاملات UI (دکمه‌ها)
       ========================================================= */
    function sellAll() {
      if (!isMerchantPresent()) { showToast("بازرگان نیامده است!"); return; }
      const inv = state.inventory;
      const total = inv.apples * CONFIG.SELL_PRICES.apples + inv.milk * CONFIG.SELL_PRICES.milk + inv.cheese * CONFIG.SELL_PRICES.cheese + inv.eggs * CONFIG.SELL_PRICES.eggs;
      if (total === 0) { showToast("انبار خالی است!"); return; }
      state.coins += total; state.inventory = { apples: 0, milk: 0, cheese: 0, eggs: 0 };
      state.lastMerchantVisit = now(); save(); renderUI(); showToast(`فروش انجام شد! +${total} سکه`);
    }

    function buySeed(type) {
      if (state.coins < CONFIG.SEED_PRICES[type]) { showToast("سکه کافی نیست!"); return; }
      state.coins -= CONFIG.SEED_PRICES[type]; state.seeds[type] += 1; save(); renderUI();
      showToast("بذر خریداری شد.");
    }

    function plantCrop(landId) {
      const land = state.lands.find(l => l.id === landId);
      if (!land || land.crop) return;
      let seedType = null;
      for (const k of ["vegetable", "wheat", "apple"]) { if (state.seeds[k] > 0) { seedType = k; break; } }
      if (!seedType) { showToast("بذر ندارید! از فروشگاه بخرید."); return; }
      state.seeds[seedType] -= 1; land.crop = seedType; land.plantedAt = now(); land.lastHarvestAt = now();
      save(); renderUI(); update3DScene(); showToast("کاشته شد!");
    }

    function harvestCrop(landId) {
      const land = state.lands.find(l => l.id === landId);
      if (!land || !land.crop) return;
      if (now() - land.lastHarvestAt < CONFIG.CROP_GROW_TIME) { showToast("هنوز آماده نیست."); return; }
      const value = CONFIG.CROP_VALUES[land.crop];
      state.coins += value; land.lastHarvestAt = now(); save(); renderUI(); update3DScene();
      showToast(`برداشت شد! +${value} سکه`);
    }

    function buyLand() {
      const price = getNextLandPrice();
      if (state.coins < price) { showToast(`سکه کافی نیست! نیاز: ${price}`); return; }
      state.coins -= price; state.landsPurchased += 1;
      state.lands.push({ id: state.lands.length + 1, crop: null, plantedAt: null, lastHarvestAt: null });
      save(); renderUI(); update3DScene(); showToast("زمین جدید خریداری شد!");
    }

    function buyAnimal(type) {
      const prices = { sheep: CONFIG.SHEEP_PRICE, chicken: CONFIG.CHICKEN_PRICE, cow: CONFIG.COW_PRICE };
      if (state.coins < prices[type]) { showToast("سکه کافی نیست!"); return; }
      processTimers();
      state.coins -= prices[type]; state.animals[type] += 1; state.lastProduction[type] = now();
      save(); renderUI(); update3DScene(); showToast("حیوان خریداری شد!");
    }

    function killAnimal(type) {
      if (state.animals[type] <= 0) { showToast("حیوانی ندارید!"); return; }
      processTimers();
      state.animals[type] -= 1; state.coins += CONFIG.KILL_VALUES[type];
      if (state.animals[type] === 0) state.lastProduction[type] = now();
      save(); renderUI(); update3DScene(); showToast(`حیوان کشته شد. +${CONFIG.KILL_VALUES[type]} سکه`);
    }

    function useGiftCode() {
      const input = document.getElementById("giftInput");
      const code = input.value.trim().toUpperCase();
      if (!GIFT_CODES[code]) { showToast("کد نامعتبر است!"); return; }
      if (state.usedGiftCodes.includes(code)) { showToast("قبلاً استفاده شده!"); return; }
      state.coins += GIFT_CODES[code]; state.usedGiftCodes.push(code);
      input.value = ""; save(); renderUI(); showToast(`🎁 +${GIFT_CODES[code]} سکه`);
    }

    /* =========================================================
       3. رندر UI
       ========================================================= */
    function renderUI() {
      if (!state) return;
      document.getElementById("farmNameDisplay").textContent = state.farmName;
      document.getElementById("coinsDisplay").textContent = state.coins;
      document.getElementById("invApples").textContent = state.inventory.apples;
      document.getElementById("invMilk").textContent = state.inventory.milk;
      document.getElementById("invCheese").textContent = state.inventory.cheese;
      document.getElementById("invEggs").textContent = state.inventory.eggs;
      
      document.getElementById("seedVeg").textContent = state.seeds.vegetable;
      document.getElementById("seedWheat").textContent = state.seeds.wheat;
      document.getElementById("seedApple").textContent = state.seeds.apple;

      document.getElementById("countCow").textContent = state.animals.cow;
      document.getElementById("countSheep").textContent = state.animals.sheep;
      document.getElementById("countChicken").textContent = state.animals.chicken;

      // بازرگان
      const mStatus = document.getElementById("merchantStatus");
      if (isMerchantPresent()) {
        mStatus.innerHTML = "✅ <b>بازرگان حاضر است!</b>";
        mStatus.style.color = "#27ae60";
        document.getElementById("sellAllBtn").disabled = false;
      } else {
        mStatus.innerHTML = `⏳ بازرگان در ${formatTime(CONFIG.MERCHANT_INTERVAL - (now() - state.lastMerchantVisit))} می‌آید.`;
        mStatus.style.color = "#e67e22";
        document.getElementById("sellAllBtn").disabled = true;
      }

      // زمین‌ها
      const landsContainer = document.getElementById("landsContainer");
      landsContainer.innerHTML = "";
      state.lands.forEach(land => {
        const div = document.createElement("div");
        div.style.display = "flex"; div.style.justifyContent = "space-between"; div.style.alignItems = "center";
        div.style.background = "#fff"; div.style.padding = "5px"; div.style.borderRadius = "6px"; div.style.fontSize = "12px";

        const text = document.createElement("span");
        if (!land.crop) {
          text.textContent = `زمین ${land.id}: خالی`;
          const btn = document.createElement("button");
          btn.textContent = "کاشت"; btn.className = "btn btn-green"; btn.style.width = "auto"; btn.style.margin = "0"; btn.style.padding = "4px 8px";
          btn.onclick = () => plantCrop(land.id);
          div.appendChild(text); div.appendChild(btn);
        } else {
          const since = now() - land.lastHarvestAt;
          if (since >= CONFIG.CROP_GROW_TIME) {
            text.textContent = `زمین ${land.id}: آماده`;
            const btn = document.createElement("button");
            btn.textContent = "برداشت"; btn.className = "btn btn-harvest"; btn.style.width = "auto"; btn.style.margin = "0"; btn.style.padding = "4px 8px";
            btn.onclick = () => harvestCrop(land.id);
            div.appendChild(text); div.appendChild(btn);
          } else {
            text.textContent = `زمین ${land.id}: رشد (${formatTime(CONFIG.CROP_GROW_TIME - since)})`;
            div.appendChild(text);
          }
        }
        landsContainer.appendChild(div);
      });

      document.getElementById("buyLandBtn").textContent = `خرید زمین (${getNextLandPrice()} سکه)`;
      document.getElementById("buyLandBtn").disabled = state.coins < getNextLandPrice();

      // حیوانات
      const animalsContainer = document.getElementById("animalsContainer");
      animalsContainer.innerHTML = "";
      ["cow", "sheep", "chicken"].forEach(key => {
        if (state.animals[key] > 0) {
          const div = document.createElement("div");
          div.style.display = "flex"; div.style.justifyContent = "space-between"; div.style.alignItems = "center";
          div.style.background = "#fdf1e6"; div.style.padding = "5px"; div.style.borderRadius = "6px"; div.style.fontSize = "12px";
          const names = { cow: "گاو", sheep: "گوسفند", chicken: "مرغ" };
          div.innerHTML = `<span>${names[key]} (${state.animals[key]})</span>`;
          const btn = document.createElement("button");
          btn.textContent = `کشتن (+${CONFIG.KILL_VALUES[key]})`;
          btn.className = "btn btn-kill"; btn.style.width = "auto"; btn.style.margin = "0"; btn.style.padding = "4px 8px"; btn.style.background = "#e74c3c";
          btn.onclick = () => killAnimal(key);
          div.appendChild(btn);
          animalsContainer.appendChild(div);
        }
      });
    }

    /* =========================================================
       4. محیط سه‌بعدی (Three.js)
       ========================================================= */
    let scene, camera, renderer, controls;
    let landMeshes = []; // برای ذخیره مش‌های زمین
    let animalMeshes = []; // برای ذخیره مش‌های حیوانات
    let cropMeshes = []; // برای ذخیره گیاهان

    function init3D() {
      const container = document.getElementById('canvas-container');
      
      // صحنه
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB); // آسمان آبی
      scene.fog = new THREE.Fog(0x87CEEB, 20, 50);

      // دوربین
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(12, 12, 12);

      // رندرر
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // کنترلر دوربین (چرخش با موس)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05; // جلوگیری از رفتن دوربین زیر زمین
      controls.minDistance = 5;
      controls.maxDistance = 30;

      // نورپردازی
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.left = -15;
      dirLight.shadow.camera.right = 15;
      dirLight.shadow.camera.top = 15;
      dirLight.shadow.camera.bottom = -15;
      scene.add(dirLight);

      // زمین اصلی (چمن)
      const groundGeo = new THREE.PlaneGeometry(40, 40);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x7CFC00 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      
      // انیمیشن شناور بودن حیوانات (حرکت بالا و پایین)
      const time = Date.now() * 0.002;
      animalMeshes.forEach((animal, index) => {
        if (animal.userData.baseY !== undefined) {
          animal.position.y = animal.userData.baseY + Math.sin(time + index) * 0.1;
        }
      });

      renderer.render(scene, camera);
    }

    // مدل‌سازها
    function createLand(x, z) {
      const geo = new THREE.BoxGeometry(3, 0.2, 3);
      const mat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // قهوه‌ای
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.1, z);
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function createWheat() {
      const group = new THREE.Group();
      for(let i=0; i<5; i++) {
        const geo = new THREE.CylinderGeometry(0.05, 0.05, 1, 8);
        const mat = new THREE.MeshLambertMaterial({ color: 0xE1C699 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((Math.random()-0.5)*2, 0.5, (Math.random()-0.5)*2);
        mesh.castShadow = true;
        group.add(mesh);
      }
      return group;
    }

    function createVegetable() {
      const group = new THREE.Group();
      for(let i=0; i<3; i++) {
        const geo = new THREE.SphereGeometry(0.3, 16, 16);
        const mat = new THREE.MeshLambertMaterial({ color: 0x2ECC71 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((Math.random()-0.5)*2, 0.3, (Math.random()-0.5)*2);
        mesh.castShadow = true;
        group.add(mesh);
      }
      return group;
    }

    function createAppleTree() {
      const group = new THREE.Group();
      // تنه
      const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 8);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = 0.75;
      trunk.castShadow = true;
      group.add(trunk);
      // برگ‌ها
      const leafGeo = new THREE.IcosahedronGeometry(1, 0);
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x27AE60 });
      const leaves = new THREE.Mesh(leafGeo, leafMat);
      leaves.position.y = 1.8;
      leaves.castShadow = true;
      group.add(leaves);
      // سیب‌ها
      const appleGeo = new THREE.SphereGeometry(0.15, 8, 8);
      const appleMat = new THREE.MeshLambertMaterial({ color: 0xE74C3C });
      for(let i=0; i<4; i++) {
        const apple = new THREE.Mesh(appleGeo, appleMat);
        apple.position.set((Math.random()-0.5)*1.5, 1.5 + Math.random()*0.5, (Math.random()-0.5)*1.5);
        group.add(apple);
      }
      return group;
    }

    function createCow() {
      const group = new THREE.Group();
      // بدن
      const bodyGeo = new THREE.BoxGeometry(1.6, 0.8, 0.8);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.8; body.castShadow = true; group.add(body);
      // لکه‌ها
      const spotGeo = new THREE.BoxGeometry(0.4, 0.4, 0.81);
      const spotMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const spot = new THREE.Mesh(spotGeo, spotMat);
      spot.position.set(0.3, 0.9, 0); group.add(spot);
      // سر
      const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
      const head = new THREE.Mesh(headGeo, bodyMat);
      head.position.set(1.0, 0.9, 0); head.castShadow = true; group.add(head);
      // پاها
      const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.6, 8);
      [-0.6, 0.6].forEach(x => {
        [-0.3, 0.3].forEach(z => {
          const leg = new THREE.Mesh(legGeo, bodyMat);
          leg.position.set(x, 0.3, z); leg.castShadow = true; group.add(leg);
        });
      });
      return group;
    }

    function createSheep() {
      const group = new THREE.Group();
      // پشم (بدن)
      const bodyGeo = new THREE.IcosahedronGeometry(0.6, 0);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xFDFEFE });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.8; body.castShadow = true; group.add(body);
      // سر
      const headGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      const headMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0.6, 0.8, 0); head.castShadow = true; group.add(head);
      // پاها
      const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
      [-0.3, 0.3].forEach(x => {
        [-0.2, 0.2].forEach(z => {
          const leg = new THREE.Mesh(legGeo, headMat);
          leg.position.set(x, 0.25, z); leg.castShadow = true; group.add(leg);
        });
      });
      return group;
    }

    function createChicken() {
      const group = new THREE.Group();
      // بدن
      const bodyGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xF1C40F });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5; body.castShadow = true; group.add(body);
      // سر و تاج
      const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
      const head = new THREE.Mesh(headGeo, bodyMat);
      head.position.set(0.3, 0.8, 0); head.castShadow = true; group.add(head);
      
      const combGeo = new THREE.ConeGeometry(0.1, 0.2, 8);
      const combMat = new THREE.MeshLambertMaterial({ color: 0xE74C3C });
      const comb = new THREE.Mesh(combGeo, combMat);
      comb.position.set(0.3, 1.0, 0); group.add(comb);
      // منقار
      const beakGeo = new THREE.ConeGeometry(0.05, 0.15, 8);
      const beakMat = new THREE.MeshLambertMaterial({ color: 0xE67E22 });
      const beak = new THREE.Mesh(beakGeo, beakMat);
      beak.rotation.z = -Math.PI/2; beak.position.set(0.5, 0.8, 0); group.add(beak);
      
      return group;
    }

    // به‌روزرسانی صحنه 3D بر اساس State
    function update3DScene() {
      if(!scene) return;

      // پاک کردن مش‌های قبلی
      landMeshes.forEach(m => scene.remove(m));
      cropMeshes.forEach(m => scene.remove(m));
      animalMeshes.forEach(m => scene.remove(m));
      landMeshes = []; cropMeshes = []; animalMeshes = [];

      // ساخت زمین‌ها
      const cols = 3;
      state.lands.forEach((land, i) => {
        const x = (i % cols) * 4 - 4;
        const z = Math.floor(i / cols) * 4 - 2;
        
        const landMesh = createLand(x, z);
        landMeshes.push(landMesh);

        // اگر محصولی کاشته شده
        if (land.crop) {
          let cropGroup;
          if (land.crop === 'wheat') cropGroup = createWheat();
          else if (land.crop === 'vegetable') cropGroup = createVegetable();
          else if (land.crop === 'apple') cropGroup = createAppleTree();
          
          cropGroup.position.set(x, 0.2, z);
          scene.add(cropGroup);
          cropMeshes.push(cropGroup);
        }
      });

      // ساخت حیوانات
      let animalX = -6;
      let animalZ = 6;
      
      const addAnimals = (type, count) => {
        if (count <= 0) return;
        for (let i = 0; i < count; i++) {
          let mesh;
          if (type === 'cow') mesh = createCow();
          else if (type === 'sheep') mesh = createSheep();
          else if (type === 'chicken') mesh = createChicken();

          // چیدمان حیوانات
          mesh.position.set(animalX, 0, animalZ);
          mesh.rotation.y = Math.PI / 2; // رو به روی دوربین
          mesh.userData.baseY = 0; // برای انیمیشن
          scene.add(mesh);
          animalMeshes.push(mesh);

          animalX += 2;
          if (animalX > 6) { animalX = -6; animalZ += 2.5; }
        }
      };

      addAnimals('cow', state.animals.cow);
      addAnimals('sheep', state.animals.sheep);
      addAnimals('chicken', state.animals.chicken);
      
      // درخت سیب اولیه در گوشه مزرعه
      if(state.appleTree.exists) {
        const initialTree = createAppleTree();
        initialTree.position.set(6, 0.2, -4);
        scene.add(initialTree);
        cropMeshes.push(initialTree); // برای پاکسازی بعدی
      }
    }

    /* =========================================================
       5. راه‌اندازی
       ========================================================= */
    function startGame(farmName) {
      state = createInitialState(farmName);
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("gameUI").classList.remove("hidden");
      
      init3D();
      checkDailyBonus();
      update3DScene();
      renderUI();
      save();

      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(() => {
        processTimers();
        renderUI(); // فقط UI آپدیت شود، 3D در صورت تغییر آپدیت می‌شود
      }, 1000);
    }

    // بارگذاری بازی قبلی
    (function init() {
      const saved = load();
      if (saved && saved.farmName) {
        state = saved;
        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("gameUI").classList.remove("hidden");
        init3D();
        checkDailyBonus();
        update3DScene();
        renderUI();
        
        if (tickInterval) clearInterval(tickInterval);
        tickInterval = setInterval(() => { processTimers(); renderUI(); }, 1000);
      }
    })();

    // رویدادها
    document.getElementById("startBtn").addEventListener("click", () => {
      const name = document.getElementById("farmNameInput").value.trim();
      if (!name) { alert("نام مزرعه را وارد کنید!"); return; }
      localStorage.removeItem(SAVE_KEY); // شروع مجدد
      startGame(name);
    });

    document.getElementById("sellAllBtn").addEventListener("click", sellAll);
    document.getElementById("buyLandBtn").addEventListener("click", buyLand);
    document.getElementById("giftBtn").addEventListener("click", useGiftCode);

    document.querySelectorAll("[data-seed]").forEach(btn => btn.addEventListener("click", () => buySeed(btn.dataset.seed)));
    document.querySelectorAll("[data-buy]").forEach(btn => btn.addEventListener("click", () => buyAnimal(btn.dataset.buy)));

  </script>
