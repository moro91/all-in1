<script>
/* OmniTools patch: real date conversion, age calculator, world clocks, file compressor. */

// ---------- Jalali -> Gregorian (JDF algorithm) ----------
function j2g(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + 365 * jy + ~~(jy / 33) * 8 + ~~(((jy % 33) + 3) / 4) + jd +
    (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
  let gy = 400 * ~~(days / 146097);
  days %= 146097;
  if (days > 36524) { gy += 100 * ~~(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal = [0, 31, (gy % 4 == 0 && gy % 100 != 0) || gy % 400 == 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  for (; gm < 13 && gd > sal[gm]; gm++) gd -= sal[gm];
  return [gy, gm, gd];
}

// Current/any date parts in Jalali via Intl (Tehran time)
function jParts(date) {
  const p = {};
  new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', {
    timeZone: 'Asia/Tehran', year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
  }).formatToParts(date).forEach(x => { p[x.type] = parseInt(x.value) % (x.type === 'hour' ? 24 : 1e9); });
  return p;
}
const jLeap = y => [1, 5, 9, 13, 17, 22, 26, 30].includes(((y % 33) + 33) % 33);
const jMonthLen = (y, m) => (m <= 6 ? 31 : m <= 11 ? 30 : jLeap(y) ? 30 : 29);

// ---------- Date converter ----------
function convertJalaliDate() {
  const jy = +document.getElementById('convYear').value;
  const jm = +document.getElementById('convMonth').value;
  const jd = +document.getElementById('convDay').value;
  if (!jy || jm < 1 || jm > 12 || jd < 1 || jd > jMonthLen(jy, jm)) {
    document.getElementById('resGregorian').innerText = 'تاریخ نامعتبر';
    document.getElementById('resHijri').innerText = 'تاریخ نامعتبر';
    return;
  }
  const [gy, gm, gd] = j2g(jy, jm, jd);
  document.getElementById('resGregorian').innerText = `${gy} / ${String(gm).padStart(2, '0')} / ${String(gd).padStart(2, '0')}`;
  const d = new Date(Date.UTC(gy, gm - 1, gd, 12));
  document.getElementById('resHijri').innerText =
    d.toLocaleDateString('fa-IR-u-ca-islamic', { timeZone: 'UTC', year: 'numeric', month: 'long', day: 'numeric' });
}

// ---------- Age calculator (live) ----------
let ageTimer = null;
function startAgeCalc() {
  clearInterval(ageTimer);
  const by = +document.getElementById('birthYear').value, bm = +document.getElementById('birthMonth').value,
        bd = +document.getElementById('birthDay').value, bh = +document.getElementById('birthHour').value || 0,
        bmin = +document.getElementById('birthMin').value || 0, bs = +document.getElementById('birthSec').value || 0;
  if (!by || bm < 1 || bm > 12 || bd < 1 || bd > jMonthLen(by, bm)) { alert('تاریخ تولد نامعتبر است.'); return; }
  const [gy, gm, gd] = j2g(by, bm, bd);
  const birth = new Date(gy, gm - 1, gd, bh, bmin, bs);
  const zodiac = ['حمل','ثور','جوزا','سرطان','اسد','سنبله','میزان','عقرب','قوس','جدی','دلو','حوت'][bm - 1];
  const animals = ['میمون','خروس','سگ','خوک','موش','گاو','ببر','خرگوش','اژدها','مار','اسب','بز'];
  document.getElementById('zodiacSign').innerText = zodiac;
  document.getElementById('animalYear').innerText = animals[gy % 12];
  document.getElementById('bornDayOfWeek').innerText = birth.toLocaleDateString('fa-IR', { weekday: 'long' });

  const tick = () => {
    const now = new Date(), n = jParts(now);
    let y = n.year - by, m = n.month - bm, d = n.day - bd;
    let secs = (n.hour * 3600 + n.minute * 60 + n.second) - (bh * 3600 + bmin * 60 + bs);
    if (secs < 0) { secs += 86400; d--; }
    if (d < 0) { const pm = n.month === 1 ? 12 : n.month - 1; d += jMonthLen(pm === 12 ? n.year - 1 : n.year, pm); m--; }
    if (m < 0) { m += 12; y--; }
    const set = (id, v) => document.getElementById(id).innerText = v;
    set('ageYears', y); set('ageMonths', m); set('ageDays', d);
    set('ageHours', ~~(secs / 3600)); set('ageMins', ~~((secs % 3600) / 60)); set('ageSecs', secs % 60);
    const ms = now - birth, f = v => Math.floor(v).toLocaleString('fa-IR');
    set('totalDaysLived', f(ms / 864e5)); set('totalHoursLived', f(ms / 36e5));
    set('totalMinsLived', f(ms / 6e4)); set('totalSecsLived', f(ms / 1e3));
    // next birthday
    let ny = n.year;
    const bdayDay = Math.min(bd, jMonthLen(ny, bm));
    let [ng, nm, ndd] = j2g(ny, bm, bdayDay);
    let next = new Date(ng, nm - 1, ndd, bh, bmin, bs);
    if (next <= now) { ny++; [ng, nm, ndd] = j2g(ny, bm, Math.min(bd, jMonthLen(ny, bm))); next = new Date(ng, nm - 1, ndd, bh, bmin, bs); }
    const diff = next - now, dd = ~~(diff / 864e5), r = ~~((diff % 864e5) / 1e3);
    const p2 = v => String(v).padStart(2, '0');
    set('nextBdayCountdown', `${dd} روز ، ${p2(~~(r / 3600))}:${p2(~~((r % 3600) / 60))}:${p2(r % 60)}`);
  };
  tick();
  ageTimer = setInterval(tick, 1000);
}

// ---------- World clocks ----------
(function () {
  const zones = [['تهران','Asia/Tehran'],['استانبول','Europe/Istanbul'],['دبی','Asia/Dubai'],['مسکو','Europe/Moscow'],
    ['لندن','Europe/London'],['پاریس','Europe/Paris'],['نیویورک','America/New_York'],['لس‌آنجلس','America/Los_Angeles'],
    ['توکیو','Asia/Tokyo'],['پکن','Asia/Shanghai'],['دهلی نو','Asia/Kolkata'],['سیدنی','Australia/Sydney']];
  const grid = document.getElementById('worldClocksGrid');
  grid.innerHTML = zones.map((z, i) => `<div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 text-center space-y-1">
      <span class="text-xs text-slate-400 block">${z[0]}</span>
      <span id="wc-${i}" class="text-xl font-black font-mono text-cyan-300">--:--:--</span></div>`).join('');
  const upd = () => zones.forEach((z, i) => {
    document.getElementById('wc-' + i).innerText =
      new Date().toLocaleTimeString('en-GB', { timeZone: z[1], hour12: false });
  });
  upd(); setInterval(upd, 1000);
})();

// ---------- File compressor ----------
let queuedFiles = [], resultBlobs = [];

(function () {
  const dz = document.getElementById('dropZone'), inp = document.getElementById('fileInput');
  const add = files => { queuedFiles = queuedFiles.concat(Array.from(files)); showQueue(); };
  dz.addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') inp.click(); });
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('border-purple-400'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('border-purple-400'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('border-purple-400'); add(e.dataTransfer.files); });
  inp.addEventListener('change', () => { add(inp.files); inp.value = ''; });
})();

const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(1) + ' KB';

function showQueue() {
  document.getElementById('resultArea').classList.toggle('hidden', !queuedFiles.length);
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  queuedFiles.forEach(f => {
    const row = document.createElement('div');
    row.className = 'bg-slate-900/90 p-3 rounded-xl border border-slate-800 flex justify-between text-xs';
    row.innerHTML = '<span class="text-slate-200"></span><span class="text-slate-400 font-mono"></span>';
    row.children[0].textContent = f.name;
    row.children[1].textContent = fmtSize(f.size) + ' • در صف';
    list.appendChild(row);
  });
}

function compressImage(file, quality, maxDim, fmt) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img;
      if (maxDim !== 'original' && Math.max(w, h) > +maxDim) {
        const s = +maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s);
      }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let type = fmt === 'auto' ? (file.type === 'image/png' ? 'image/webp' : file.type) : fmt;
      if (!['image/jpeg', 'image/webp'].includes(type)) type = 'image/webp';
      c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve({ blob: b, type }) : reject(); }, type, quality);
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function processFiles() {
  if (!queuedFiles.length) { alert('ابتدا فایل انتخاب کنید.'); return; }
  const q = +document.getElementById('compQuality').value,
        md = document.getElementById('maxDim').value, fmt = document.getElementById('outFormat').value;
  const list = document.getElementById('fileList');
  list.innerHTML = ''; resultBlobs = [];
  for (const f of queuedFiles) {
    const row = document.createElement('div');
    row.className = 'bg-slate-900/90 p-3 rounded-xl border border-slate-800 flex flex-wrap justify-between items-center gap-2 text-xs';
    const name = document.createElement('span'); name.className = 'text-slate-200'; name.textContent = f.name;
    const info = document.createElement('span'); info.className = 'text-slate-400 font-mono'; info.textContent = 'در حال پردازش...';
    row.append(name, info); list.appendChild(row);
    try {
      if (!f.type.startsWith('image/')) throw new Error('unsupported');
      const { blob, type } = await compressImage(f, q, md, fmt);
      const out = blob.size < f.size ? blob : f; // never return a bigger file
      const ext = out === f ? f.name.split('.').pop() : (type === 'image/jpeg' ? 'jpg' : 'webp');
      const outName = f.name.replace(/\.[^.]+$/, '') + '-min.' + ext;
      resultBlobs.push({ name: outName, blob: out });
      const saved = Math.max(0, Math.round((1 - out.size / f.size) * 100));
      info.textContent = `${fmtSize(f.size)} ← ${fmtSize(out.size)} (${saved}٪ کاهش)`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(out); a.download = outName;
      a.className = 'bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded-lg font-bold';
      a.textContent = 'دانلود'; row.appendChild(a);
    } catch (e) {
      info.textContent = 'فقط تصاویر پشتیبانی می‌شوند (این فایل فشرده نشد)';
      info.className = 'text-amber-400';
    }
  }
  document.getElementById('zipAllBtn').classList.toggle('hidden', resultBlobs.length < 2);
}

async function downloadAllZip() {
  const zip = new JSZip();
  resultBlobs.forEach(r => zip.file(r.name, r.blob));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'OmniTools-compressed.zip'; a.click();
}

function resetList() {
  queuedFiles = []; resultBlobs = [];
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('zipAllBtn').classList.add('hidden');
}
</script>
